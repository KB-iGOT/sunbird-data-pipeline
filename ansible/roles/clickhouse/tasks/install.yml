- name: Wait for dpkg lock to be released
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Ensure dpkg is configured
  command: dpkg --configure -a
  register: dpkg_fix
  failed_when: false
  changed_when: false

- name: Update apt cache (with lock timeout)
  apt:
    update_cache: yes
    lock_timeout: 300

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - dirmngr
      - chrony
    state: present
    lock_timeout: 300
