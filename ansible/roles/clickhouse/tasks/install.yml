# ---- APT LOCK HANDLING (Ansible 2.8 safe) ----

- name: Wait for dpkg frontend lock
  shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for dpkg lock
  shell: |
    while fuser /var/lib/dpkg/lock >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false

- name: Wait for apt lists lock
  shell: |
    while fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
      sleep 5
    done
  args:
    executable: /bin/bash
  changed_when: false

# ---- RECOVER BROKEN STATE SAFELY ----

- name: Ensure dpkg is configured
  command: dpkg --configure -a
  failed_when: false
  changed_when: false

# ---- APT OPERATIONS (RETRY BASED) ----

- name: Update apt cache
  apt:
    update_cache: yes
  register: apt_update
  retries: 10
  delay: 15
  until: apt_update is succeeded

- name: Install prerequisites
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - dirmngr
      - chrony
    state: present
  register: apt_install
  retries: 10
  delay: 15
  until: apt_install is succeeded

- name: Install ClickHouse
  apt:
    name:
      - clickhouse-server
      - clickhouse-client
    state: present
